version: '3.8'

# Nginx Proxy with Let's Encrypt SSL
# This creates a reverse proxy that automatically routes traffic to customer containers
# based on virtual host (domain name) and manages SSL certificates

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx/conf.d/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf:ro
      - nginx-certs:/etc/nginx/certs:ro
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - nginx-dhparam:/etc/nginx/dhparam
    environment:
      DEFAULT_HOST: ${DEFAULT_HOST:-}
      TRUST_DOWNSTREAM_PROXY: "false"
    networks:
      - proxy_network
    labels:
      - "com.github.nginx-proxy.nginx"

  acme-companion:
    image: nginxproxy/acme-companion:latest
    container_name: nginx-proxy-acme
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx-certs:/etc/nginx/certs:rw
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - nginx-dhparam:/etc/nginx/dhparam
      - acme-state:/etc/acme.sh
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: ${ACME_EMAIL:-admin@example.com}
    networks:
      - proxy_network
    depends_on:
      - nginx-proxy

networks:
  proxy_network:
    name: www-proxy
    driver: bridge

volumes:
  nginx-certs:
  nginx-vhost:
  nginx-html:
  nginx-dhparam:
  acme-state:
